<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>En écoute</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>

  <main class="card">
    <!-- Écran de connexion -->
    <section id="login-view" hidden>
      <h1>Qu'est-ce que j'écoute ?</h1>
      <p class="muted">Connecte ton compte Spotify pour voir le titre en cours et contrôler la lecture.</p>
      <button class="btn-main" id="login-btn" type="button">Se connecter avec Spotify</button>
    </section>

    <!-- Lecteur -->
    <section id="player-view" hidden>
      <div class="cover-wrap">
        <img id="cover" alt="" width="640" height="640">
        <div class="cover-empty" id="cover-empty">Rien en lecture</div>
      </div>

      <div class="meta">
        <h2 id="title">Rien en lecture</h2>
        <p id="artist" class="muted">Lance un titre sur un appareil Spotify.</p>
        <p id="album" class="muted small"></p>
      </div>

      <div class="progress">
        <span id="time-now">0:00</span>
        <div class="bar" role="progressbar" aria-label="Progression du titre" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="bar-fill" id="bar-fill"></div>
        </div>
        <span id="time-total">0:00</span>
      </div>

      <div class="controls">
        <button class="btn-icon" id="shuffle-btn" type="button" aria-label="Lecture aléatoire" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        </button>
        <button class="btn-icon" id="prev-btn" type="button" aria-label="Titre précédent">
          <svg viewBox="0 0 24 24" class="fill"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        </button>
        <button class="btn-play" id="play-btn" type="button" aria-label="Lecture">
          <svg viewBox="0 0 24 24" class="fill" id="icon-play"><path d="M8 5v14l11-7z"/></svg>
          <svg viewBox="0 0 24 24" class="fill" id="icon-pause" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <button class="btn-icon" id="next-btn" type="button" aria-label="Titre suivant">
          <svg viewBox="0 0 24 24" class="fill"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg>
        </button>
        <button class="btn-icon" id="logout-btn" type="button" aria-label="Se déconnecter">
          <svg viewBox="0 0 24 24"><path d="M10 4H5v16h5M16 8l4 4-4 4M20 12H9"/></svg>
        </button>
      </div>

      <p class="device small muted" id="device"></p>
    </section>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
